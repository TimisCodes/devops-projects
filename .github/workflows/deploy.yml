name: CI/CD Pipeline - GadgetApp

on:
  push:
    branches: [ "kubernetes" ] # Runs when you push to your kubernetes branch

jobs:
  build-and-push-and-deploy:
    runs-on: self-hosted # 🌟 Uses your local machine runner instead of cloud VMs

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using repository/environment secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./gadgetapp/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gadgetapp-frontend:latest

      # 4. Build and Push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./gadgetapp/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gadgetapp-backend:latest

      # 5. Run Docker Compose locally on your machine
      - name: Deploy Locally via Docker Compose
        run: |
          cd gadgetapp
          docker compose pull
          docker compose down
          docker compose up -d
          docker image prune -f
        shell: bash # Ensures it runs via Git Bash or WSL on Windows