name: CI/CD Pipeline - GadgetApp

on:
  push:
    branches: [ "kubernetes" ] # Runs when you push to your kubernetes branch

jobs:
  build-and-push-and-deploy:
    runs-on: ubuntu-latest
    
    # 🌟 This explicitly links the job to your GitHub "production" environment
    environment: 
      name: production

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using production secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gadgetapp-frontend:latest

      # 4. Build and Push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gadgetapp-backend:latest

      # 5. Connect to your VM via SSH to pull the new images and restart containers
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to your project directory on the VM
            cd ~/devops-projects/gadgetapp

            # Fetch and switch to the target branch and pull latest updates
            git fetch origin kubernetes
            git checkout kubernetes
            git pull origin kubernetes

            # Pull the newly pushed images from Docker Hub and restart containers
            docker compose pull
            docker compose down
            docker compose up -d

            # Clean up old unused Docker images
            docker image prune -f