---
- name: Database
  hosts: dbservers
  become: yes
  #vars:
   #dbname: electric
   #dbuser: current
   #dbpass: tesla
  tasks:
    - debug:
        msg: "The dbname is {{dbname}}"
    - name: Install mariadb server
      ansible.builtin.yum:
        name: mariadb-server
        state: present

    - name: Install pymysql
      ansible.builtin.yum:
        name: python3-PyMySQL
        state: present

    - name: Start mariadb
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    - name: Create a new database with name 'accounts'
      ansible.mysql.mysql_db:
        name: accounts
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create database user
      ansible.mysql.mysql_user:
        name: '{{dbname}}'
        password: '{{dbpass}}'
        priv: '*.*:ALL'
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      register: dbout

    - name: Print dbout variable
      debug:
        var: dbout
