apiVersion: v1 
kind: Pod
metadata:
  name: secret-pod
specs:
  containers:
    - name: secret-container
      image: busybox:1.36
      commands: ["/bin/sh", "-c"]
      args:
      - |
        echo "Database username is: $DB_USER" > /etc/gadget-secrets/app.txt
        echo "Database password is available" >> /etc/gadget-secrets/app.txt
        echo "Database host is: $DB_HOST" >> /etc/gadget-secrets/app.txt
        echo "Database name is: $DB_NAME" >> /etc/gadget-secrets/app.txt
        sleep 3600
      volumeMounts:
        - name: gadget-secret-volume
          mountPath: /etc/gadget-secrets
          readOnly: true
      env:
        - name: DB_NAME     
          valueFrom:
            secretKeyRef:
              name: gadget-secret
              key: DB_NAME

        - name: DB_PASSWORD    
          valueFrom:
            secretKeyRef:
              name: gadget-secret
              key: DB_PASSWORD

        - name: DB_USER     
          valueFrom:
            secretKeyRef:
              name: gadget-secret
              key: DB_USER

        - name: DB_HOST    
          valueFrom:
            secretKeyRef:
              name: gadget-secret
              key: DB_HOST
  volumes:
    - name: gadget-secret-volume
      secret:
        secretName: gadget-secret     