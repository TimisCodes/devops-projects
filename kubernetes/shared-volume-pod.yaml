apiVersion: v1
kind: Pod
metadata:
  name: shared-volume
specs:
  containers:
    - name: writer
      image: busybox:1.36
      commands: ["/bin/sh", "-c"]
      args: 
       - 'echo "Hello" >> /shared/message.txt; sleep 3600'
      volumeMounts:
        - name: writer-mounts
          mountPath: /shared

#For the second container

    - name: reader
      image: busybox:1.36
      commands: ["/bin/sh", "-c"]
      args: 
       - 'echo cat /shared/message.txt 2>/dev/null; sleep 3600'
      volumeMounts:
        - name: writer-mounts
          mountPath: /shared
    
  volume:
    - name: writer-mounts
      emptyDir: {}