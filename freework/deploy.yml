---
- name: Manage webserver
  hosts: web01
  become: true

  tasks:

    - name: Install Apache
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Start apache
      ansible.builtin.service:
        name: httpd
        state: started

    - name: Enable Apache on boot
      ansible.builtin.service:
        name: httpd
        enabled: true

    - name: Copy file
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'

