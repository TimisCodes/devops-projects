
services:
  frontend:
    build:
      context: ./frontend
    container_name: gadgetapp-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gadget-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: gadgetapp-backend
    environment:
      PORT: 2300
      UPLOAD_DIR: /app/uploads
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: timiscode-gadgetapp-images-2026
    ports:
      - "2300:2300"
    volumes:
      - gadget-uploads:/app/uploads
      - type: bind
        source: ${USERPROFILE:-/root}/.aws
        target: /root/.aws
        read_only: true
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:2300/api/health', response => { response.resume(); process.exit(response.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gadget-network
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: gadgetapp-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: timiscode-gadgetapp-images-2026
    volumes:
      - gadget-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gadget-network
    restart: unless-stopped

networks:
  gadget-network:
    driver: bridge

volumes:
  gadget-data:
  gadget-uploads:
