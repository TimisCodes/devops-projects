version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: gadgetapp-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - gadget-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: gadgetapp-backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "2300:2300" # Uncomment this if you want to access the API directly from your host/browser
    depends_on:
      database:
        condition: service_healthy
    networks:
      - gadget-network
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: gadgetapp-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gadget-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gadget-network
    restart: unless-stopped

networks:
  gadget-network:
    driver: bridge

volumes:
  gadget-data: