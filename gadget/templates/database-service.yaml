apiVersion: v1
kind: Service
metadata:
  name: {{ include "gadget.database.fullname" . }}
  labels:
    {{- include "gadget.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "gadget.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
