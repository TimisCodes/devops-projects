apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gadget.database.fullname" . }}-pvc
  labels:
    {{- include "gadget.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.database.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.database.storage }}
