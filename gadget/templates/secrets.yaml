apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gadget.fullname" . }}-secret
  labels:
    {{- include "gadget.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
