apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gadget.fullname" . }}-config
  labels:
    {{- include "gadget.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  UPLOAD_DIR: {{ .Values.config.uploadDir | quote }}
  DB_HOST: {{ include "gadget.database.fullname" . | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  S3_BUCKET_NAME: {{ .Values.config.s3BucketName | quote }}
