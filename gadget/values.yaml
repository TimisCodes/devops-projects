# GadgetApp Helm Chart Values
# Sensitive values (db.password, sessionSecret) must be supplied at deploy time.
# Do NOT commit real secrets to version control.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

imagePullSecrets: []

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 1
  image:
    repository: timiscode/gadgetapp-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080   # only used when type is NodePort
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------
backend:
  replicaCount: 1
  image:
    repository: timiscode/gadgetapp-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 2300
  containerPort: 2300
  uploads:
    enabled: true
    storage: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

# ---------------------------------------------------------------------------
# Database (PostgreSQL 17)
# ---------------------------------------------------------------------------
database:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  storage: 5Gi
  storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Application configuration (non-sensitive) — goes into ConfigMap
# ---------------------------------------------------------------------------
config:
  port: "2300"
  uploadDir: "/app/uploads"
  dbPort: "5432"
  dbName: "gadgetdb"
  dbUser: "gadgetuser"
  awsRegion: "us-east-1"
  s3BucketName: "timiscode-gadgetapp-images-2026"

# ---------------------------------------------------------------------------
# Secrets — OVERRIDE these at deploy time, never commit real values.
# Supply via: --set secrets.dbPassword=... --set secrets.sessionSecret=...
# ---------------------------------------------------------------------------
secrets:
  dbPassword: "CHANGE_ME"
  sessionSecret: "CHANGE_ME_USE_A_RANDOM_32_CHAR_STRING"
  postgresPassword: "CHANGE_ME"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: "gadgetapp.example.com"
  tls: []

# ---------------------------------------------------------------------------
# Pod-level settings
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
